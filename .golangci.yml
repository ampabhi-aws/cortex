output:
  format: line-number

linters:
  enable:
    - goimports
    - revive
    - gofmt
    - misspell
    - depguard
    - forbidigo

linters-settings:
  staticcheck:
    checks:
      - all
  errcheck:
    # path to a file containing a list of functions to exclude from checking
    # see https://github.com/kisielk/errcheck#excluding-functions for details
    exclude: ./.errcheck-exclude
  goimports:
    local-prefixes: "github.com/cortexproject/cortex"

  depguard:
    list-type: blacklist
    include-go-root: true
    packages-with-error-message:
      - github.com/go-kit/kit/log: "Use github.com/go-kit/log instead of github.com/go-kit/kit/log"

  forbidigo:
    # Ban the unsound `*((*[]byte)(unsafe.Pointer(&s)))` string->[]byte
    # reinterpretation: it reads a 3-word slice header from a 2-word string
    # header, so the resulting slice's capacity is indeterminate and the
    # construct is undefined behaviour under Go's unsafe.Pointer rules.
    # Use util.YoloBuf (which builds a correctly-sized header with
    # cap == len) or, preferably, io.WriteString / xxhash.Digest.WriteString.
    forbid:
      - '\*\(\(\*\[\]byte\)\(unsafe\.Pointer\(&'
    exclude_godoc_examples: false

run:
  timeout: 5m

  # List of build tags, all linters use it.
  build-tags:
    - netgo
    - requires_docker
